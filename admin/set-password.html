<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NARDTOPUS | Set Password</title>
<link rel="icon" href="../assets/ochoudo-favicon.png"><link rel="stylesheet" href="admin.css">
<style>
.setup-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.setup-card{width:min(100%,500px);background:#fff;border:1px solid #e0e6ef;border-radius:16px;padding:30px;box-shadow:0 15px 45px rgba(7,27,73,.09);text-align:center}.setup-logo{width:82px;height:82px;object-fit:cover;border-radius:12px;margin-bottom:14px}.setup-card h1{color:#071b49;margin:0 0 8px}.setup-card p{color:#68758d;font-size:13px;line-height:1.6}.setup-form{text-align:left;margin-top:22px}.setup-form label{display:block;color:#61708a;font-size:9px;font-weight:900;letter-spacing:.08em;margin:13px 0 6px}.setup-form input{width:100%;min-height:44px;border:1px solid #d7dfea;border-radius:8px;padding:0 12px;font:inherit}.setup-button{width:100%;margin-top:18px;min-height:44px;border:0;border-radius:8px;background:#071b49;color:#fff;font-weight:900;cursor:pointer}.setup-button:disabled{opacity:.55}.setup-message{margin-top:14px;padding:10px;border-radius:8px;background:#f3f6fa;color:#61708a;font-size:11px}.setup-powered{margin-top:24px;color:#71809b;font-size:9px;letter-spacing:.08em}
</style>
</head>
<body class="admin-body">
<main class="setup-wrap"><section class="setup-card">
<img class="setup-logo" src="../assets/nardtopus-mark.png" alt="NARDTOPUS">
<div class="admin-kicker">NARDTOPUS ADMINISTRATION</div>
<h1>Set Your Password</h1>
<p>Your administrator invitation has been accepted. Create a password for your secure NARDTOPUS account.</p>
<form id="setupForm" class="setup-form">
<label for="password">NEW PASSWORD</label><input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirmPassword">CONFIRM PASSWORD</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
<button id="setupButton" class="setup-button" type="submit">SET PASSWORD</button>
<div id="setupMessage" class="setup-message" role="alert" aria-live="polite"></div>
</form>
<div class="setup-powered">POWERED BY NARDTOPUS · A VIVID ARC TECHNOLOGIES LTD. PLATFORM</div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="set-password.js?v=20260912-1"></script>
</body></html>
