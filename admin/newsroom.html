<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsroom Management | OMG Admin</title><link rel="stylesheet" href="../newsroom.css"><style>.editor{background:#fff;padding:25px;border-radius:12px;display:grid;gap:12px;margin-bottom:30px}.editor input,.editor textarea,.editor select{width:100%}.actions{display:flex;gap:12px;flex-wrap:wrap}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #ddd;padding:12px 0;flex-wrap:wrap}button{cursor:pointer}.danger{background:#8b1e2a}</style></head><body><header><a href="dashboard.html" style="color:white">← OMG Admin Dashboard</a><nav><a href="../newsroom.html">Public Newsroom</a><button id="logout" class="btn">Log out</button></nav></header><main class="wrap"><h1>Newsroom Management</h1><p id="message" role="status">Checking administrator access...</p><div id="workspace" hidden><form id="editor" class="editor"><h2 id="formTitle">Create Article</h2><input id="title" placeholder="Article headline" required maxlength="220"><input id="slug" placeholder="URL slug (auto-generated)" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*"><select id="category"><option>Latest News</option><option>Leadership & Vision</option><option>Issues That Matter</option><option>From the Grassroots</option><option>Photo & Video Stories</option></select><input id="author" placeholder="Author" value="OMG Media Team" maxlength="120"><textarea id="excerpt" placeholder="Short summary for article cards and search engines" rows="3" maxlength="300"></textarea><textarea id="body" placeholder="Write the full article here (plain text, paragraphs supported)" rows="14" required></textarea><label>Featured image <input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><input id="imageUrl" type="url" placeholder="Or paste an HTTPS image URL"><div class="actions"><button class="btn" type="submit" data-status="draft">Save Draft</button><button class="btn" type="submit" data-status="published">Publish</button><button type="button" id="reset">New Article</button></div></form><h2>Existing Articles</h2><div id="articles"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../newsroom-config.js"></script><script src="newsroom-admin.js"></script></body></html>
